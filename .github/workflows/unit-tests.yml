name: Unit Tests
permissions:
  contents: read

on:
  push:
    branches: [version-16, feat/redesign, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Tests:
    runs-on: ubuntu-latest

    services:
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -uroot -proot" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-pip-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      # Bench with the public dependency apps is slow to build and changes rarely. Cache it per
      # day: the key carries the workflow hash (pinned versions) and the exact Python (the venv
      # symlinks into the toolcache). Private apps are never cached: fork PRs can restore
      # base-branch caches, so they are fetched and installed on every run after the restore.
      - name: Bench cache key
        id: bench-key
        run: |
          if [ -n "$RTBOT_TOKEN" ]; then
            echo "PRIVATE_APPS=telephony helpdesk crm frappe_appointment india_compliance rtcamp" >> "$GITHUB_ENV"
          else
            echo "RTBOT_TOKEN unavailable (fork PR) — skipping private rtcamp app; rtcamp-gated tests will skip"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> RTBOT_TOKEN unavailable (fork PR) — private apps were not installed; rtcamp-gated tests will skip." >> "$GITHUB_STEP_SUMMARY"
            echo "PRIVATE_APPS=" >> "$GITHUB_ENV"
          fi
          echo "key=bench-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('.github/workflows/unit-tests.yml') }}-$(date +%F)" >> "$GITHUB_OUTPUT"
        env:
          RTBOT_TOKEN: ${{ secrets.RTBOT_TOKEN }}

      - uses: actions/cache/restore@v6
        id: bench-cache
        with:
          path: ~/frappe-bench
          key: ${{ steps.bench-key.outputs.key }}

      - name: Setup bench
        run: |
          pip install frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          # throwaway CI DB: skip fsync per commit
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL innodb_flush_log_at_trx_commit = 0"
          if [ "$CACHE_HIT" != "true" ]; then
            bench init --skip-redis-config-generation --skip-assets --frappe-branch v16.31.0 --python "$(which python)" ~/frappe-bench
          fi
        env:
          CACHE_HIT: ${{ steps.bench-cache.outputs.cache-hit }}

      - name: Get dependency apps
        if: steps.bench-cache.outputs.cache-hit != 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch v16.32.1 --skip-assets
          bench get-app hrms --branch v16.16.0 --skip-assets
          bench get-app frappe_gmail_thread https://github.com/rtCamp/frappe-gmail-thread --branch develop --skip-assets
          bench get-app frappe_comment_xt https://github.com/rtCamp/frappe-comment-xt --branch develop --skip-assets
          bench get-app frappe_slack_connector https://github.com/rtCamp/frappe-slack-connector --branch develop --skip-assets
        env:
          CI: "Yes"

      - uses: actions/cache/save@v6
        if: steps.bench-cache.outputs.cache-hit != 'true'
        with:
          path: ~/frappe-bench
          key: ${{ steps.bench-key.outputs.key }}

      # Installing erpnext/hrms/... into the site is ~100s and independent of next_pms and the
      # private apps, so cache a DB dump of the public apps only (same key as the bench).
      - uses: actions/cache/restore@v6
        id: site-cache
        with:
          path: ~/site-cache
          key: site-${{ steps.bench-key.outputs.key }}

      - name: Create site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin --no-mariadb-socket test_site
          if [ "$SITE_CACHE_HIT" = "true" ]; then
            bench --site test_site --force restore ~/site-cache/db.sql.gz --db-root-password root
          else
            bench --site test_site install-app erpnext hrms frappe_gmail_thread frappe_comment_xt frappe_slack_connector
            mkdir -p ~/site-cache
            bench --site test_site backup --backup-path ~/site-cache
            mv ~/site-cache/*-database.sql.gz ~/site-cache/db.sql.gz
            find ~/site-cache -type f ! -name db.sql.gz -delete
          fi
        env:
          CI: "Yes"
          SITE_CACHE_HIT: ${{ steps.site-cache.outputs.cache-hit }}

      - uses: actions/cache/save@v6
        if: steps.site-cache.outputs.cache-hit != 'true'
        with:
          path: ~/site-cache
          key: site-${{ steps.bench-key.outputs.key }}

      - name: Install private apps
        if: env.PRIVATE_APPS != ''
        working-directory: /home/runner/frappe-bench
        run: |
          git config --global "url.https://rtbot:${RTBOT_TOKEN}@github.com/rtCamp/.insteadOf" "https://github.com/rtCamp/"
          bench get-app telephony --branch develop --skip-assets
          bench get-app helpdesk --branch v1.29.0 --skip-assets
          bench get-app crm --branch v1.83.0 --skip-assets
          bench get-app frappe_appointment https://github.com/rtCamp/frappe-appointment --branch develop --skip-assets
          bench get-app india_compliance https://github.com/resilient-tech/india-compliance --branch v16.8.4 --skip-assets
          bench get-app rtcamp "https://${RTCAMP_APP}" --branch develop --skip-assets
          git config --global --unset "url.https://rtbot:${RTBOT_TOKEN}@github.com/rtCamp/.insteadOf"
          bench --site test_site install-app $PRIVATE_APPS
        env:
          CI: "Yes"
          RTBOT_TOKEN: ${{ secrets.RTBOT_TOKEN }}
          RTCAMP_APP: ${{ secrets.RTCAMP_APP }}

      - name: Install next_pms
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app next_pms "$GITHUB_WORKSPACE" --skip-assets
          bench --site test_site install-app next_pms
        env:
          CI: "Yes"

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app next_pms
